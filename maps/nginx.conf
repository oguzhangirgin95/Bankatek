# Karo sunucusu: pmtiles arsivini ve yazi tiplerini statik dosya olarak verir.
#
# Ayri bir karo sunucusu yazilimi (tileserver-gl gibi) yok. PMTiles tek dosyalik
# bir arsiv; istemci ihtiyaci olan baytlari HTTP Range istegiyle cekiyor, gerisi
# sira disi bir sey yapmayan bir dosya sunucusu isi.

server {
    listen 80;
    server_name _;
    root /data;

    # Range istekleri gzip ile birlikte calismiyor: nginx sikistirilmis icerigin
    # bir araligini veremediginden 'Accept-Ranges' basligini dusuruyor ve
    # istemci 1-2 GB'lik arsivin tamamini indirmeye kalkiyor. Sikistirma bu
    # yuzden kapali; pmtiles zaten kendi icinde sikistirilmis veri tasiyor.
    gzip off;

    types {
        application/octet-stream pmtiles;
        application/x-protobuf    pbf;
        application/json          json;
        image/png                 png;
    }

    location / {
        # Gelistirmede uygulama 4200'de, karolar 8088'de duruyor; tarayici bunu
        # capraz kaynak sayiyor. Range guvenli listede olmadigi icin istekten
        # once OPTIONS geliyor, o yuzden ayrica yanitlaniyor.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match";
            add_header Access-Control-Max-Age       86400;
            add_header Content-Length               0;
            return 204;
        }

        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag, Accept-Ranges" always;

        # Karo ve yazi tipi yalnizca yeni bir uretimde degisir; adresleri de
        # degismedigi icin uzun onbellek guvenli.
        add_header Cache-Control "public, max-age=604800" always;

        try_files $uri =404;
    }
}
