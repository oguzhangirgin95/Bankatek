# Bankatek giris temasi.
#
# parent=base: base'den yalnizca .ftl sablonlari gelir, hazir CSS gelmez.
# Gorunumun tamami resources/css/login.css icinde ve uygulamanin login
# ekraniyla ayni degerleri kullanir.
parent=base

styles=css/login.css

meta=viewport==width=device-width,initial-scale=1

# Realm'de secilebilecek diller. Metinler messages/messages_tr|en.properties
# dosyalarinda; geri kalani base temanin dil paketinden gelir.
locales=tr,en

# base/login/template.ftl bu yuvalara sinif adi yaziyor; CSS bunlara baglaniyor.
kcLoginClass=login-page
kcFormCardClass=login-form
kcAlertClass=alert

# Sifre yenileme, oturum suresi doldu gibi diger Keycloak ekranlari da ayni
# gorunsun diye base sablonlarinin kullandigi sinif adlari.
kcFormGroupClass=field
kcButtonClass=button

# Giris kutusunun altindaki "Destek" baglantisinin adresi (mailto: da olur).
bankatekSupportUrl=#
