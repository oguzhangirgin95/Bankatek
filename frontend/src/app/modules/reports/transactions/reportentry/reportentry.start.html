<h2>{{ labels().title }}</h2>

<app-card [title]="labels().formTitle" [subtitle]="labels().hint">
  <div class="filters">
    <app-input id="reportName" [label]="labels().name" [(ngModel)]="State.Request.reportName" />
    <app-select
      id="reportType"
      [label]="labels().type"
      [placeholder]="labels().all"
      [options]="State.TypeList ?? []"
      [(ngModel)]="State.Request.reportType"
    />
  </div>

  <div class="filters">
    <app-select
      id="cityId"
      [label]="labels().city"
      [placeholder]="labels().all"
      [options]="State.CityList ?? []"
      [ngModel]="State.Request.cityId"
      (ngModelChange)="setCity($event)"
    />
    <app-select
      id="branchId"
      [label]="labels().branch"
      [placeholder]="labels().all"
      [options]="State.BranchList ?? []"
      [(ngModel)]="State.Request.branchId"
    />
    <app-input id="startDate" type="date" [label]="labels().startDate" [(ngModel)]="State.Request.startDate" />
    <app-input id="endDate" type="date" [label]="labels().endDate" [(ngModel)]="State.Request.endDate" />
  </div>
</app-card>
