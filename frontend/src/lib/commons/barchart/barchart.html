<div class="app-barchart" [class.app-barchart--clickable]="clickable()">
  @if (title()) {
    <h3>{{ title() }}</h3>
  }

  @for (item of items(); track item.label) {
    <div
      class="app-barchart__row"
      (click)="barClicked.emit(item)"
      (mousemove)="showTooltip(item, $event)"
      (mouseleave)="hideTooltip()"
    >
      <span class="app-barchart__label">{{ item.label }}</span>
      <span class="app-barchart__track">
        <span class="app-barchart__bar" [style.width.%]="percent(item.value)"></span>
      </span>
      <span class="app-barchart__value">{{ item.value }}</span>
    </div>
  } @empty {
    @if (loading()) {
      <app-skeleton [lines]="5" [height]="22" />
    } @else {
      <p class="app-barchart__empty">{{ emptyText() }}</p>
    }
  }

  <app-tooltip [state]="tooltip()" />
</div>
