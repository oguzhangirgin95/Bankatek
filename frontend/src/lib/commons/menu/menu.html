<div class="app-menu">
  <button type="button" class="app-menu__toggle" (click)="toggleDrawer()">
    <span class="app-menu__bars"></span>
    {{ title() }}
  </button>

  @if (drawerOpen()) {
    <div class="app-menu__backdrop" (click)="closeAll()"></div>
  }

  <nav class="app-menu__panel" [class.app-menu__panel--open]="drawerOpen()">
    <button type="button" class="app-menu__collapse" [title]="title()" (click)="toggleDrawer()">
      <span class="app-menu__bars"></span>
    </button>

    <span class="app-menu__title">{{ title() }}</span>

    <div class="app-menu__list">
      @for (item of transactions(); track item.path) {
        <button
          type="button"
          class="app-menu__transaction"
          [class.app-menu__transaction--active]="isActive(item.path)"
          (click)="go(item.path)"
        >
          {{ item.text }}
        </button>
      }
    </div>

    @if (modules().length) {
      <span class="app-menu__title app-menu__title--modules">{{ modulesTitle() }}</span>

      @for (module of modules(); track module.code) {
        <button
          type="button"
          class="app-menu__item app-menu__item--module"
          [class.app-menu__item--active]="isActiveModule(module.code)"
          (click)="go(module.path)"
          [title]="module.text"
        >
          <svg class="app-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path [attr.d]="icon(module.code)" />
          </svg>
          <span class="app-menu__label">{{ module.text }}</span>
        </button>
      }
    }
  </nav>
</div>
