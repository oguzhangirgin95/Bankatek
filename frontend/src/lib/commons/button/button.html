<button
  [attr.id]="id() || null"
  class="app-button"
  [class]="cssClass()"
  [class.app-button--secondary]="variant() === 'secondary'"
  [class.app-button--outline]="variant() === 'outline'"
  [type]="type()"
  [disabled]="disabled()"
  (click)="clicked.emit()"
>
  {{ label() }}<ng-content />
</button>
